<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة البث المباشر</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0a0e17;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 1.1rem; font-weight: 800; color: #38bdf8; }
    .badge-live { background: #ef4444; color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }
    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    video { width: 100%; height: 100%; display: block; object-fit: contain; }
    .info-box {
      background: #131b2e;
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #1e293b;
    }
    .channels { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .ch-btn {
      background: #131b2e;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #1e293b;
    }
    .ch-btn.active { border-color: #38bdf8; color: #38bdf8; background: #1e293b; }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><i class="fa-solid fa-tower-broadcast"></i> LIVE SPORT TV</div>
    <div class="badge-live">LIVE</div>
  </nav>

  <div class="container">
    <div class="video-box">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="info-box">
      <div id="channelTitle" style="font-weight: bold;">اختر قناة</div>
      <div id="status" style="font-size: 12px; color: #38bdf8;">جاهز</div>
    </div>

    <ul class="channels" id="channelList"></ul>
  </div>

  <script>
    const channels = [
      {
        name: "قناة YTV PRO الملتقطة",
        url: "http://h35.zenvion.online/live/31009988005/index.m3u8?t=qVbwIgonsa0bO2FygXtz2Q&e=1787466309",
        referer: "https://x.com/",
        useProxy: true
      },
      {
        name: "قناة Red Bull TV الرياضية",
        url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",
        useProxy: false
      },
      {
        name: "قناة TRT World الإخبارية",
        url: "https://tv-trtworld.medya.trt.com.tr/master.m3u8",
        useProxy: false
      }
    ];

    const video = document.getElementById('videoPlayer');
    const channelList = document.getElementById('channelList');
    const channelTitle = document.getElementById('channelTitle');
    const status = document.getElementById('status');
    let hls = null;

    function renderList(activeIdx) {
      channelList.innerHTML = '';
      channels.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.className = `ch-btn ${idx === activeIdx ? 'active' : ''}`;
        li.innerHTML = `<i class="fa-solid fa-play"></i> <span>${ch.name}</span>`;
        li.onclick = () => play(idx);
        channelList.appendChild(li);
      });
    }

    function play(idx) {
      renderList(idx);
      const ch = channels[idx];
      channelTitle.innerText = ch.name;
      status.innerText = "جاري الاتصال...";

      if (hls) hls.destroy();

      const streamUrl = ch.useProxy 
        ? `/api/stream?ref=${encodeURIComponent(ch.referer)}&url=${encodeURIComponent(ch.url)}` 
        : ch.url;

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          status.innerText = "البث مباشر";
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) status.innerText = "انتهى التوكن أو توقف السيرفر";
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
      }
    }

    renderList(0);
    play(0);
  </script>
</body>
</html>
