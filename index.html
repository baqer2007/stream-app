<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سينما بلس VIP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #e50914;
      --bg-main: #0a0e17;
      --bg-card: #131b2e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(15, 23, 42, 0.95);
      padding: 16px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .logo { font-size: 1.4rem; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .search-box { position: relative; width: 40%; max-width: 350px; }
    .search-box input { width: 100%; padding: 10px 38px 10px 16px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .container { max-width: 1300px; margin: 0 auto; padding: 24px; width: 100%; flex: 1; }
    .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title::before { content: ''; width: 4px; height: 20px; background: var(--primary); border-radius: 2px; }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .movie-card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .movie-card:hover { transform: translateY(-6px); border-color: var(--primary); }

    .poster-box { position: relative; width: 100%; height: 260px; background: #050811; }
    .movie-poster { width: 100%; height: 100%; object-fit: cover; }
    .quality-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: var(--accent); font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }

    .movie-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .movie-title { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

    /* نافذة المشغل */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: #000; width: 100%; max-width: 950px; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .modal-header { background: #1e293b; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; }

    video { width: 100%; height: 500px; background: #000; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo"><i class="fa-solid fa-film"></i> CINEMA PLUS</div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="ابحث في مكتبة الأفلام..." oninput="filterMovies()">
    </div>
  </header>

  <div class="container">
    <div class="section-title">أحدث الأفلام المتاحة للتشغيل</div>
    <div class="movies-grid" id="moviesGrid">
      <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
        <p style="margin-top: 15px;">جاري الاتصال بالسيرفر وجلب الأفلام...</p>
      </div>
    </div>
  </div>

  <div class="modal" id="playerModal">
    <div class="modal-box">
      <div class="modal-header">
        <span id="playerTitle" style="font-weight: 700; color: var(--accent);">مشاهدة الفيلم</span>
        <button class="close-btn" onclick="closePlayer()">&times;</button>
      </div>
      <video id="videoPlayer" controls playsinline></video>
    </div>
  </div>

  <script>
    const SERVER_URL = "http://forevertv.me:8080";
    const USERNAME   = "F9nYwbIukJU5Zw";
    const PASSWORD   = "A6XjAFurDBu3c2";

    const moviesGrid = document.getElementById("moviesGrid");
    const playerModal = document.getElementById("playerModal");
    const videoPlayer = document.getElementById("videoPlayer");
    const playerTitle = document.getElementById("playerTitle");

    let library = [];

    async function loadMovies() {
      try {
        const targetUrl = `${SERVER_URL}/player_api.php?username=${USERNAME}&password=${PASSWORD}&action=get_vod_streams`;
        const res = await fetch(`/api/stream?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();

        if (Array.isArray(data) && data.length > 0) {
          library = data;
          render(library);
        } else {
          moviesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444;">لم يتم العثور على أفلام في السيرفر.</div>`;
        }
      } catch (err) {
        moviesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444;">تعذر تحميل القائمة. تأكد من رفع ملف api/stream.js المحدث.</div>`;
      }
    }

    function render(items) {
      moviesGrid.innerHTML = "";
      items.slice(0, 50).forEach(item => {
        const card = document.createElement("div");
        card.className = "movie-card";
        
        const ext = item.container_extension || "mp4";
        const videoUrl = `${SERVER_URL}/movie/${USERNAME}/${PASSWORD}/${item.stream_id}.${ext}`;
        const poster = item.stream_icon || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80";

        card.onclick = () => playMovie(item.name, videoUrl);

        card.innerHTML = `
          <div class="poster-box">
            <span class="quality-badge">${ext.toUpperCase()}</span>
            <img src="${poster}" class="movie-poster" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80'">
          </div>
          <div class="movie-info">
            <div class="movie-title">${item.name}</div>
            <div class="movie-meta">
              <span style="color: var(--gold);">★ ${item.rating || '8.5'}</span>
              <span style="color: #22c55e;">جاهز</span>
            </div>
          </div>
        `;
        moviesGrid.appendChild(card);
      });
    }

    function filterMovies() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      render(library.filter(m => m.name.toLowerCase().includes(q)));
    }

    function playMovie(title, streamUrl) {
      playerTitle.innerText = "مشاهدة: " + title;
      // تشغيل الفيديو عبر البروكسي الداخلي
      videoPlayer.src = `/api/stream?url=${encodeURIComponent(streamUrl)}`;
      playerModal.classList.add("active");
      videoPlayer.play().catch(() => {});
    }

    function closePlayer() {
      videoPlayer.pause();
      videoPlayer.src = "";
      playerModal.classList.remove("active");
    }

    loadMovies();
  </script>
</body>
</html>
