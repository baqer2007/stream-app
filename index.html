<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بث القنوات الرياضية المباشرة</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #070d18;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
    }
    .live-badge {
      background-color: #ef4444;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .app-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .status-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .channel-item {
      background-color: #0f172a;
      color: #e2e8f0;
      border: 1px solid #1e293b;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s;
    }
    .channel-item:hover {
      background-color: #1e293b;
    }
    .channel-item.active {
      background-color: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <span class="live-badge">LIVE</span>
      <div class="app-title">LIVE SPORT TV 📡</div>
    </div>

    <div class="player-container">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="status-box">
      <span id="currentStatus">جاري تجهيز البث...</span>
      <span style="color: #22c55e;">● متصل</span>
    </div>

    <div class="channels-list">
      <!-- القناة 1 (المعرف 6123) -->
      <button class="channel-item active" onclick="playChannel('/api/stream?url=' + encodeURIComponent('http://213.183.40.59/iptv/8DNEYEKGDK3SKVGLNPWNEP9Q/6123/mono.m3u8'), 'قناة beIN Sports 1 HD', this)">
        <span>beIN Sports 1 HD</span>
        <span>◀</span>
      </button>

      <!-- القناة 2 (المعرف 6131) -->
      <button class="channel-item" onclick="playChannel('/api/stream?url=' + encodeURIComponent('http://5.182.228.251/iptv/8DNEYEKGDK3SKVGLNPWNEP9Q/6131/mono.m3u8'), 'قناة beIN Sports 2 HD', this)">
        <span>beIN Sports 2 HD</span>
        <span>◀</span>
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const statusText = document.getElementById('currentStatus');
    let hls = null;

    function playChannel(url, name, btn) {
      if (btn) {
        document.querySelectorAll('.channel-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      statusText.innerText = "جاري تشغيل: " + name;

      if (Hls.isSupported()) {
        if (hls) {
          hls.destroy();
        }
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          statusText.innerText = "يعمل الآن: " + name;
          video.play().catch(e => console.log("Autoplay blocked:", e));
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error("HLS Error:", data);
            statusText.innerText = "خطأ في الاتصال بالسيرفر";
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          statusText.innerText = "يعمل الآن: " + name;
          video.play().catch(() => {});
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const activeBtn = document.querySelector('.channel-item.active');
      if (activeBtn) {
        activeBtn.click();
      }
    });
  </script>
</body>
</html>
