<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بث مباشر - المشغل الرياضي</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls-card {
      background-color: #111827;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .channel-btn {
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .channel-btn:hover {
      background-color: #2563eb;
      border-color: #3b82f6;
    }

    .channel-btn.active {
      background-color: #0284c7;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-wrapper">
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="controls-card">
      <div class="status-header">
        <span class="status-dot"></span>
        <span id="channelName">اختر القناة للتشغيل</span>
      </div>

      <div class="channels-grid">
        <button class="channel-btn" onclick="playChannel('https://playertest.longtailvideo.com/adaptive/oceans_aes/oceans_aes.m3u8', 'قناة اختبار البث المشفر AES', this)">
          اختبار بث AES (تأكيد المشغل)
        </button>
        <button class="channel-btn" onclick="playChannel('http://h55.medianexa.online/live/31009988005/index.m3u8?t=1iGPbxUX6fKN4sajqSWXBg&e=1787498185', 'سيرفر YTV PRO الملتقط', this)">
          سيرفر YTV PRO
        </button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    let hls = null;

    function playChannel(streamUrl, name, btn) {
      if (btn) {
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      document.getElementById('channelName').innerText = name;

      const finalUrl = `/api/stream?url=${encodeURIComponent(streamUrl)}`;

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true });
        hls.loadSource(finalUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = finalUrl;
        video.play().catch(() => {});
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // تجربة القناة الأولى تلقائياً للتأكد من عمل المحرك
      const firstBtn = document.querySelector('.channel-btn');
      if (firstBtn) firstBtn.click();
    });
  </script>
</body>
</html>
