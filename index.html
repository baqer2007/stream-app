<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بث مباشر - قنوات رياضية</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f293d;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls-panel {
      background-color: #131b2e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #1f293d;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .channel-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-title::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
    }

    .channels-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .channel-btn {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
    }

    .channel-btn:hover {
      background-color: #2563eb;
      border-color: #3b82f6;
    }

    .channel-btn.active {
      background-color: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-wrapper">
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="controls-panel">
      <div class="channel-title" id="currentChannelName">beIN SPORTS 1 HD</div>
      
      <div class="channels-list">
        <button class="channel-btn active" onclick="playStream('http://h55.medianexa.online/live/31009988005/index.m3u8?t=1iGPbxUX6fKN4sajqSWXBg&e=1787498185', 'beIN SPORTS 1 HD', this)">
          سيرفر YTV PRO
        </button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    let hls = null;

    function playStream(rawUrl, channelName, element) {
      if (element) {
        document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
      }
      document.getElementById('currentChannelName').innerText = channelName;

      // توجيه الرابط عبر البروكسي الداخلي
      const proxyUrl = `/api/stream?url=${encodeURIComponent(rawUrl)}`;

      if (Hls.isSupported()) {
        if (hls) {
          hls.destroy();
        }
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });
        hls.loadSource(proxyUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // تشغيل مباشر لأجهزة Safari و iOS
        video.src = proxyUrl;
        video.addEventListener('loadedmetadata', function () {
          video.play().catch(() => {});
        });
      }
    }

    // تشغيل تلقائي عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      playStream('http://h55.medianexa.online/live/31009988005/index.m3u8?t=1iGPbxUX6fKN4sajqSWXBg&e=1787498185', 'beIN SPORTS 1 HD');
    });
  </script>
</body>
</html>
