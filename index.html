<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE SPORT TV</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #070d18;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
    }

    .live-badge {
      background-color: #ef4444;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .status-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel-item {
      background-color: #0f172a;
      color: #e2e8f0;
      border: 1px solid #1e293b;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .channel-item:hover {
      background-color: #1e293b;
      border-color: #38bdf8;
    }

    .channel-item.active {
      background-color: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .play-icon {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <span class="live-badge">LIVE</span>
      <div class="app-title">LIVE SPORT TV 📡</div>
    </div>

    <div class="player-container">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="status-box">
      <span id="currentStatus">جاري تجهيز البث...</span>
      <span style="color: #22c55e;">● مباشر</span>
    </div>

    <div class="channels-list">
      <button class="channel-item active" onclick="playChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'بث تجريبي رياضي HD 1', this)">
        <span>بث تجريبي رياضي HD</span>
        <span class="play-icon">◀</span>
      </button>

      <button class="channel-item" onclick="playChannel('https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8', 'قناة Red Bull TV الرياضية', this)">
        <span>قناة Red Bull TV الرياضية</span>
        <span class="play-icon">◀</span>
      </button>

      <button class="channel-item" onclick="playChannel('https://cph-p2p-msl.akamaized.net/hls/live/200034/test/master.m3u8', 'قناة الرياضة والأحداث الكبرى', this)">
        <span>قناة الأحداث الكبرى Akamai</span>
        <span class="play-icon">◀</span>
      </button>

      <button class="channel-item" onclick="playChannel('https://d2e1asnslrmhmn.cloudfront.net/out/v1/4b9e0986e579414ca5529f796ef53524/index.m3u8', 'قناة البث الإخباري Bloomberg', this)">
        <span>قناة Bloomberg العالمية</span>
        <span class="play-icon">◀</span>
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const statusText = document.getElementById('currentStatus');
    let hls = null;

    function playChannel(url, name, btn) {
      if (btn) {
        document.querySelectorAll('.channel-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      statusText.innerText = name;

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(err => console.log('Autoplay prevented:', err));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const activeBtn = document.querySelector('.channel-item.active');
      if (activeBtn) activeBtn.click();
    });
  </script>
</body>
</html>
