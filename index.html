<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سينما بلس - أفلام ومسلسلات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #0f172a;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #e11d48;
    }
    .search-box {
      width: 50%;
      max-width: 400px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      outline: none;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #38bdf8;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    .movie-card {
      background-color: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
    }
    .movie-card:hover {
      transform: translateY(-4px);
      border-color: #e11d48;
    }
    .movie-poster {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background-color: #0f172a;
    }
    .movie-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .movie-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-rating {
      font-size: 0.75rem;
      color: #facc15;
    }
    /* نافذة المشغل */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background-color: #0f172a;
      width: 100%;
      max-width: 950px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
    }
    .servers-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background-color: #0b0f19;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
    }
    .server-btn {
      background-color: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .server-btn.active {
      background-color: #e11d48;
      border-color: #fb7185;
      color: #fff;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .player-frame {
      width: 100%;
      height: 520px;
      border: none;
      background-color: #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎬 CINEMA PLUS</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." oninput="handleSearch()">
    </div>
  </header>

  <div class="container">
    <div class="section-title" id="sectionHeading">أحدث الأفلام الرائجة 🔥</div>
    <div class="movies-grid" id="moviesGrid"></div>
  </div>

  <!-- المشغل مع السيرفرات المتعددة -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="playerTitle" style="font-weight: 700;">مشغل الفيديو</span>
        <button class="close-btn" onclick="closePlayer()">&times;</button>
      </div>
      
      <!-- شريط التبديل بين السيرفرات -->
      <div class="servers-bar">
        <span style="align-self: center; font-size: 0.85rem; color: #94a3b8;">السيرفرات:</span>
        <button class="server-btn active" onclick="switchServer(1)">سيرفر VIP (سريع)</button>
        <button class="server-btn" onclick="switchServer(2)">سيرفر 2</button>
        <button class="server-btn" onclick="switchServer(3)">سيرفر 3 (بديل)</button>
        <button class="server-btn" onclick="switchServer(4)">سيرفر 4</button>
      </div>

      <iframe id="videoFrame" class="player-frame" allowfullscreen referrerpolicy="origin"></iframe>
    </div>
  </div>

  <script>
    const API_KEY = "8265bd1679663a7ea12ac168da84d2e8";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";

    const moviesGrid = document.getElementById("moviesGrid");
    const playerModal = document.getElementById("playerModal");
    const videoFrame = document.getElementById("videoFrame");
    const playerTitle = document.getElementById("playerTitle");
    const sectionHeading = document.getElementById("sectionHeading");

    let currentMovieId = null;

    // مصادر وسيرفرات البث المتنوعة
    const servers = {
      1: (id) => `https://vidsrc.cc/v2/embed/movie/${id}`,
      2: (id) => `https://embed.su/embed/movie/${id}`,
      3: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1`,
      4: (id) => `https://vidsrc.xyz/embed/movie/${id}`
    };

    async function fetchTrendingMovies() {
      try {
        const res = await fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}&language=ar`);
        const data = await res.json();
        renderMovies(data.results);
      } catch (err) {
        console.error(err);
      }
    }

    function renderMovies(movies) {
      moviesGrid.innerHTML = "";
      movies.forEach(movie => {
        if (!movie.poster_path) return;

        const card = document.createElement("div");
        card.className = "movie-card";
        card.onclick = () => openPlayer(movie.id, movie.title || movie.name);

        card.innerHTML = `
          <img src="${IMG_URL + movie.poster_path}" class="movie-poster" alt="${movie.title}" loading="lazy">
          <div class="movie-info">
            <div class="movie-title">${movie.title || movie.name}</div>
            <div class="movie-rating">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : "N/A"}</div>
          </div>
        `;
        moviesGrid.appendChild(card);
      });
    }

    let searchTimeout;
    function handleSearch() {
      clearTimeout(searchTimeout);
      const query = document.getElementById("searchInput").value.trim();

      if (!query) {
        sectionHeading.innerText = "أحدث الأفلام الرائجة 🔥";
        fetchTrendingMovies();
        return;
      }

      searchTimeout = setTimeout(async () => {
        sectionHeading.innerText = `نتائج البحث عن: ${query}`;
        try {
          const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&language=ar&query=${encodeURIComponent(query)}`);
          const data = await res.json();
          renderMovies(data.results);
        } catch (err) {
          console.error(err);
        }
      }, 500);
    }

    function openPlayer(id, title) {
      currentMovieId = id;
      playerTitle.innerText = "مشاهدة: " + title;
      switchServer(1);
      playerModal.classList.add("active");
    }

    function switchServer(serverNum) {
      document.querySelectorAll('.server-btn').forEach((btn, index) => {
        btn.classList.toggle('active', index + 1 === serverNum);
      });

      if (currentMovieId && servers[serverNum]) {
        videoFrame.src = servers[serverNum](currentMovieId);
      }
    }

    function closePlayer() {
      videoFrame.src = "";
      currentMovieId = null;
      playerModal.classList.remove("active");
    }

    fetchTrendingMovies();
  </script>
</body>
</html>
